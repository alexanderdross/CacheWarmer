name: Node.js CI

on:
  pull_request:
    paths:
      - "nodejs-docker/**"
      - ".github/workflows/nodejs-ci.yml"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - "nodejs-docker/**"
      - ".github/workflows/nodejs-ci.yml"

env:
  # better-sqlite3 compiles native code requiring a C++20-capable compiler, so
  # gcc/g++ 10 are pinned and installed by the "Install C++20 build toolchain"
  # step before pnpm install.
  #
  # The pin dates from a runner image that was Ubuntu 20.04, whose default g++
  # was GCC 9 (knows -std=c++2a, rejects -std=c++20). The image is now Ubuntu
  # 24.04, whose default GCC 13 would do, so the pin is no longer needed — but
  # gcc-10 is still in noble's universe repo and still works, so this is left
  # alone rather than changed in a commit whose job is to get CI green.
  CC: gcc-10
  CXX: g++-10

defaults:
  run:
    working-directory: nodejs-docker

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends make gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends make gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends make gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  test-integration:
    name: Integration Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends make gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  test-security:
    name: Security Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends make gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security

  build:
    name: Build (Next.js)
    runs-on: self-hosted
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends make gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  coverage:
    name: Test Coverage
    runs-on: self-hosted
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends make gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: nodejs-docker/coverage/
          retention-days: 14

  audit:
    name: Dependency Audit
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends make gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=critical
