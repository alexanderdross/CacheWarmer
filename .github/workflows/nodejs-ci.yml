name: Node.js CI

# Every job installs build-essential first: better-sqlite3 compiles native
# code, and the runner image ships no compiler or make of its own.

on:
  pull_request:
    paths:
      - "nodejs-docker/**"
      - ".github/workflows/nodejs-ci.yml"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - "nodejs-docker/**"
      - ".github/workflows/nodejs-ci.yml"

defaults:
  run:
    working-directory: nodejs-docker

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  test-integration:
    name: Integration Tests
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  test-security:
    name: Security Tests
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security

  build:
    name: Build (Next.js)
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  coverage:
    name: Test Coverage
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: nodejs-docker/coverage/
          retention-days: 14

  audit:
    name: Dependency Audit
    runs-on: self-hosted
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=critical

  # The Dockerfile is the documented deploy path (`docker compose up`) but was
  # gated by nothing, and had rotted into an unbuildable state (fixed in #109).
  # This keeps it building — on the self-hosted runner, at no Actions-minute
  # cost. That runner has no Docker daemon (#109's `docker build` died on a
  # missing /var/run/docker.sock), so we build with Podman instead: it is
  # daemonless, docker-compatible, and apt-installable on the runner (noble).
  # --storage-driver=vfs sidesteps the fuse/overlay privileges a container
  # runner typically lacks. The build happens inside the image, so no host Node.
  docker-build:
    name: Docker image builds
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: apt-get update && apt-get install -y --no-install-recommends podman
      - name: Build the image
        run: podman build --storage-driver=vfs -t cachewarmer:ci .
