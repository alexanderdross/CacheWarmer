name: Node.js CI

on:
  pull_request:
    paths:
      - "nodejs-docker/**"
      - ".github/workflows/nodejs-ci.yml"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - "nodejs-docker/**"
      - ".github/workflows/nodejs-ci.yml"

env:
  # better-sqlite3 compiles native code requiring a C++20-capable compiler.
  # The self-hosted runner is Ubuntu 20.04 whose default g++ is GCC 9 (only
  # knows -std=c++2a and rejects -std=c++20). GCC 10 (available in focal's
  # repos) understands -std=c++20, so pin gcc/g++ 10 for the node-gyp build.
  # The "Install C++20 build toolchain" step installs them before pnpm install.
  CC: gcc-10
  CXX: g++-10

defaults:
  run:
    working-directory: nodejs-docker

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  test-integration:
    name: Integration Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  test-security:
    name: Security Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security

  build:
    name: Build (Next.js)
    runs-on: self-hosted
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  coverage:
    name: Test Coverage
    runs-on: self-hosted
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: nodejs-docker/coverage/
          retention-days: 14

  audit:
    name: Dependency Audit
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install C++20 build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends gcc-10 g++-10
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=critical
