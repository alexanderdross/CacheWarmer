name: Node.js CI

# Every job installs build-essential first: better-sqlite3 compiles native
# code, and the runner image ships no compiler or make of its own.

on:
  pull_request:
    paths:
      - "nodejs-docker/**"
      - ".github/workflows/nodejs-ci.yml"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - "nodejs-docker/**"
      - ".github/workflows/nodejs-ci.yml"

defaults:
  run:
    working-directory: nodejs-docker

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  test-integration:
    name: Integration Tests
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  test-security:
    name: Security Tests
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security

  build:
    name: Build (Next.js)
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  coverage:
    name: Test Coverage
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: nodejs-docker/coverage/
          retention-days: 14

  audit:
    name: Dependency Audit
    runs-on: self-hosted
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodejs-docker/pnpm-lock.yaml
      - name: Install build toolchain (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=critical

  # No docker-build gate here on purpose. The self-hosted runner has no Docker
  # daemon (#109: missing /var/run/docker.sock), and it is itself an
  # unprivileged user-namespaced container with nested userns disabled
  # ("user namespaces are not enabled in
  # /proc/sys/kernel/unprivileged_userns_clone"), so no daemonless builder
  # (podman/buildah/kaniko) can build there either. A gate would therefore need
  # a GitHub-hosted runner (Actions minutes, declined) or a runner-infra change
  # (a container builder / nested userns). Until then the Dockerfile is kept
  # buildable by review, not CI. The deps-stage build toolchain fix that this
  # branch carries is orthogonal and stays regardless.
