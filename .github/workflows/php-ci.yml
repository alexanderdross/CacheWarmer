name: PHP CI

# The Node.js module is gated by nodejs-ci.yml. This workflow gates the PHP
# side of the monorepo — the WordPress plugin, Drupal module, marketing theme,
# and the license-manager plugin — none of which had any pre-merge check.
on:
  pull_request:
    paths:
      - "wordpress-plugin/**"
      - "drupal-module/**"
      - "cachewarmer-license-manager/**"
      - "theme/**"
      - ".github/workflows/php-ci.yml"
  push:
    branches: [main]
    paths:
      - "wordpress-plugin/**"
      - "drupal-module/**"
      - "cachewarmer-license-manager/**"
      - "theme/**"
      - ".github/workflows/php-ci.yml"

concurrency:
  group: php-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax (php ${{ matrix.php }})
    runs-on: self-hosted
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Lint against the floor (8.1 — Drupal module requirement) and the
        # WordPress plugin / license-manager target (8.2) so a construct that
        # only parses on newer PHP is caught.
        php: ["8.2", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Repair sudo for root
        # setup-php shells out to `sudo apt-get`. This runner image runs as
        # root but ships a sudoers without a root entry, so sudo refuses, the
        # action retries in a sleep loop, and the job hangs until it is killed
        # — 56 minutes before timeout-minutes existed. nodejs-ci.yml never hit
        # this because it calls apt-get directly.
        run: |
          if [ "$(id -u)" = "0" ] && ! sudo -n true 2>/dev/null; then
            echo 'root ALL=(ALL:ALL) ALL' >> /etc/sudoers
          fi
          sudo -n true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP source file
        # `php -l` prints parse errors to stderr (kept) and "No syntax errors"
        # to stdout (discarded). xargs exits non-zero if any file fails.
        run: |
          find wordpress-plugin drupal-module cachewarmer-license-manager theme \
            -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -r -n1 -P4 php -l > /dev/null

  composer-validate:
    name: Composer validate (license-manager)
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Repair sudo for root
        # setup-php shells out to `sudo apt-get`. This runner image runs as
        # root but ships a sudoers without a root entry, so sudo refuses, the
        # action retries in a sleep loop, and the job hangs until it is killed
        # — 56 minutes before timeout-minutes existed. nodejs-ci.yml never hit
        # this because it calls apt-get directly.
        run: |
          if [ "$(id -u)" = "0" ] && ! sudo -n true 2>/dev/null; then
            echo 'root ALL=(ALL:ALL) ALL' >> /etc/sudoers
          fi
          sudo -n true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      # The license-manager is the only PHP component with a composer.json.
      # Validate its schema (no lock file is committed, so skip the lock check).
      - name: Validate composer.json
        working-directory: cachewarmer-license-manager
        run: composer validate --no-check-lock --no-check-publish

  # The suites below exist but nothing ran them: this workflow only ever did
  # `php -l` and `composer validate`, so 758 assertions sat unexecuted. Both
  # already exit non-zero on failure, so wiring them up is all that was needed.
  drupal-tests:
    name: Drupal test suite
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Repair sudo for root
        # Same reason as above: without this, setup-php hangs instead of failing.
        run: |
          if [ "$(id -u)" = "0" ] && ! sudo -n true 2>/dev/null; then
            echo 'root ALL=(ALL:ALL) ALL' >> /etc/sudoers
          fi
          sudo -n true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Run the standalone suite
        working-directory: drupal-module/cachewarmer
        run: php tests/CacheWarmerStandaloneTest.php

  wordpress-tests:
    name: WordPress test suite
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Repair sudo for root
        run: |
          if [ "$(id -u)" = "0" ] && ! sudo -n true 2>/dev/null; then
            echo 'root ALL=(ALL:ALL) ALL' >> /etc/sudoers
          fi
          sudo -n true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Run the test suite
        working-directory: wordpress-plugin/cachewarmer
        run: php tests/CacheWarmerTestSuite.php
