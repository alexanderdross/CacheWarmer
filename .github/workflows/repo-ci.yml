name: Repo CI

# Repository-wide consistency checks that belong to no single package.
#
# There is deliberately no top-level `working-directory` here: the node-version
# check reads every workflow's own working-directory to decide which
# package.json applies, and giving this workflow one would make it skip itself.

on:
  pull_request:
    paths:
      - ".github/**"
      - "**/package.json"
      - "drupal-module/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "**/package.json"
      - "drupal-module/**"

concurrency:
  group: repo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-versions:
    name: Workflow Node versions
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # `node-version: 20` was copied into two workflows whose package needs 22,
      # and wrangler refused to start both times. pnpm reports the mismatch as a
      # warning, so it reaches CI and dies there instead of failing the install.
      - name: Every node-version satisfies its package's engines
        run: python3 .github/scripts/check-node-versions.py

  drupal-consistency:
    name: Drupal config & service references
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The Drupal module has repeatedly read config keys and injected services
      # that existed nowhere — five dead Enterprise settings, an undefined
      # logger channel, an inert pinterest target. This asserts every settings
      # read is declared and every service reference resolves.
      - name: Config keys declared, service references resolve
        run: python3 .github/scripts/check-drupal-consistency.py

  actionlint:
    name: Lint workflows
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # A pinned release binary rather than the rhysd/actionlint action, go run,
      # or docker: no go toolchain, no third-party action, no container — only
      # curl and a GitHub-release download, both of which the runner already
      # does (it fetches Node tarballs from github releases). v1.7.7's verdicts
      # were verified locally: clean on all five workflows, and it fails on a
      # broken one.
      - name: actionlint
        run: |
          set -euo pipefail
          VER=1.7.7
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          # shellcheck/pyflakes off on purpose: actionlint silently skips them
          # when absent, so leaving them on would make the result depend on
          # whatever the runner happens to have. No path arg — actionlint
          # discovers .github/workflows itself.
          /tmp/actionlint -shellcheck= -pyflakes=
