version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/nodejs-docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Minimum release age: wait 14 days after a version is published before
    # opening a PR, avoiding freshly released (and potentially compromised or
    # broken) packages.
    cooldown:
      default-days: 14
    groups:
      next-and-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
          - "@types/react"
          - "@types/react-dom"
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "@vitest/*"
          - "jsdom"
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: "eslint"
        versions: [">=10"]
    labels:
      - "dependencies"
      - "nodejs"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Minimum release age: wait 14 days after a version is published before
    # opening a PR.
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "pnpm/action-setup"
        versions: [">=5"]
      - dependency-name: "actions/checkout"
        versions: [">=5"]
      - dependency-name: "actions/setup-node"
        versions: [">=5"]
      - dependency-name: "actions/upload-artifact"
        versions: [">=5"]
    labels:
      - "dependencies"
      - "ci"
