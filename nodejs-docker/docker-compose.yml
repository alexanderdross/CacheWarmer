services:
  cachewarmer:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials:ro
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production

# Jobs run in-process and state lives in SQLite under ./data, so there is no
# queue broker to run. A Redis service used to be declared here alongside
# bullmq and ioredis dependencies, but nothing ever connected to it.
