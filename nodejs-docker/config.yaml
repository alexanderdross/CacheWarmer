server:
  port: 3000
  host: "0.0.0.0"
  apiKey: "change-me-in-production"

redis:
  host: "localhost"
  port: 6379

database:
  path: "./data/cachewarmer.db"

puppeteer:
  executablePath: "/usr/bin/chromium-browser"
  headless: true
  args:
    - "--no-sandbox"
    - "--disable-setuid-sandbox"
    - "--disable-dev-shm-usage"

cdnWarming:
  enabled: true
  concurrency: 3
  waitUntil: "networkidle0"
  timeout: 30000
  userAgents:
    desktop: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    mobile: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"

facebook:
  enabled: true
  appId: ""
  appSecret: ""
  rateLimitPerSecond: 10

linkedin:
  enabled: true
  sessionCookie: ""
  concurrency: 1
  delayBetweenRequests: 5000

twitter:
  enabled: true
  concurrency: 2
  delayBetweenRequests: 3000
  timeout: 15000

google:
  enabled: true
  serviceAccountKeyFile: "./credentials/google-sa-key.json"
  dailyQuota: 200

bing:
  enabled: true
  apiKey: ""
  dailyQuota: 10000

indexNow:
  enabled: true
  key: ""
  keyLocation: ""

scheduler:
  enabled: false
  defaultCron: "0 3 * * *"

notifications:
  webhookUrl: ""
  emailEnabled: false
  emailTo: ""
  emailFrom: "cachewarmer@localhost"
  smtpHost: ""
  smtpPort: 587
  smtpUser: ""
  smtpPass: ""

excludePatterns: ""

pinterest:
  enabled: false
  delay: 2000

cloudflare:
  enabled: false
  apiToken: ""
  zoneId: ""

imperva:
  enabled: false
  apiId: ""
  apiKey: ""
  siteId: ""

akamai:
  enabled: false
  host: ""              # e.g. akaa-xxxxx.luna.akamaiapis.net
  clientToken: ""
  clientSecret: ""
  accessToken: ""
  network: "production" # production | staging

logging:
  level: "info"
  file: "./data/cachewarmer.log"

schemaValidation:
  enabled: false
  validationEngine: "sdtt"
  presets:
    - "Google"
    - "SchemaOrg"
  scopedPaths:
    - "^/(?:[a-z]{2}/)?aircraft/[^/]+/?$"
    - "^/(?:[a-z]{2}/)?jobs/[^/]+/?$"
    - "^/(?:[a-z]{2}/)?events/[^/]+/?$"
    - "^/(?:[a-z]{2}/)?parts/listing/[^/]+/?$"
    - "^/(?:[a-z]{2}/)?parts/wanted/[^/]+/?$"
  concurrency: 4
  severityThreshold: "error"
  supabase:
    urlEnv: "SUPABASE_URL"
    serviceRoleKeyEnv: "SUPABASE_SERVICE_ROLE_KEY"
    table: "schema_validation_results"
  github:
    enabled: false
    tokenEnv: "GITHUB_TOKEN"
    repoOwner: "alexanderdross"
    repoName: "tradeaero-refactor"
    labels:
      - "schema-validation"
      - "automated"
    issueAssignees: []
    maxIssuesPerJob: 30
    reopenClosedWithinDays: 30
  autoFix:
    enabled: false
    branch: "claude/schema-validation-cache-warmer-ZQNkw"
    baseBranch: "main"
    draftPr: true
    allowedFixes:
      - "missing-context"
      - "http-to-https-context"
      - "type-literal-case"
      - "missing-organization-name"
